[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-crosscheck"
version = "0.1.0"
description = "Read-only local AI review of conflicting Markdown facts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.5,<3", "transformers>=4.48,<5", "PySocks>=1.7,<2"]

[project.scripts]
memory-crosscheck = "memory_crosscheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
